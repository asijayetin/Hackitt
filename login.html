<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hackitt | Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            Hackitt
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#features">
                Features
            </a>

            <a
                href="signup.html"
                class="nav-btn">

                Sign Up

            </a>

        </nav>

    </header>


    <!-- Login Section -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <p class="small-heading">
                    WELCOME BACK
                </p>

                <h1>
                    Login to
                    <span>Hackitt.</span>
                </h1>

                <p>
                    Enter your credentials to continue.
                </p>

            </div>


            <!-- Login Form -->
            <form
                id="loginForm"
                class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
