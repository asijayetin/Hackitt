<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participants | Hackitt</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Hackitt
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="organizer.html">
                Dashboard
            </a>

            <a href="profile-organizer.html">
                Profile
            </a>

            <a
                href="#"
                id="navLogoutBtn"
                class="nav-btn">

                Log Out

            </a>

        </nav>

    </header>


    <main class="organizer-dashboard">

        <section class="dashboard-header">

            <p class="small-heading">
                PARTICIPANTS
            </p>

            <h1>
                Registered Participants
            </h1>

            <p>
                Students registered for Hackitt Summer Jam 2026.
            </p>

        </section>


        <section class="participant-tools">
            <label for="participantSearch">Search by name, email, or skill</label>
            <input type="search" id="participantSearch" placeholder="Example: frontend">
            <p id="participantCount" aria-live="polite">Loading participants...</p>
        </section>


        <section
            id="participantsList"
            class="dashboard-grid">

        </section>

    </main>


    <footer>

        <p>
            © 2026 Hackitt. Built for Hackathons.
        </p>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/participants.js"></script>

</body>

</html>
